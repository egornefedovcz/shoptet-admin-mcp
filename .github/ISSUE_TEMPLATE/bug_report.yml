name: Bug report
description: A tool failed or returned wrong data
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste passwords, cookies, customer data or HTML copied from a real shop.** Redact shop names and URLs. Issues containing them may be deleted.
  - type: input
    id: version
    attributes: { label: Release tag or commit, placeholder: v0.1.0 }
    validations: { required: true }
  - type: dropdown
    id: lang
    attributes:
      label: Admin language
      options: [Czech, Slovak, English, Other]
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: OS and Node version, placeholder: macOS 15, Node 20.11 }
    validations: { required: true }
  - type: input
    id: tool
    attributes: { label: Tool that failed, placeholder: shoptet_get_price_list }
    validations: { required: true }
  - type: dropdown
    id: write
    attributes:
      label: Writes enabled?
      options: ["No (read-only)", "Yes"]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
      description: Include the exact error text, redacted.
    validations: { required: true }
